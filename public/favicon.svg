<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer glow -->
  <circle cx="24" cy="24" r="22" fill="rgba(61,126,255,0.08)"/>
  <!-- Globe body -->
  <circle cx="24" cy="24" r="18" stroke="#3D7EFF" stroke-width="1.5" fill="#0D1117"/>
  <!-- Latitude lines -->
  <ellipse cx="24" cy="24" rx="18" ry="8.5" stroke="#3D7EFF" stroke-width="1" opacity="0.35"/>
  <!-- Central meridian -->
  <ellipse cx="24" cy="24" rx="6" ry="18" stroke="#3D7EFF" stroke-width="1" opacity="0.45"/>
  <!-- Equator line -->
  <line x1="6.5" y1="24" x2="41.5" y2="24" stroke="#3D7EFF" stroke-width="0.8" opacity="0.3"/>
  <!-- Subject pin: Finance (London) — green -->
  <circle cx="32" cy="17" r="4" fill="#4ade80" opacity="0.18"/>
  <circle cx="32" cy="17" r="3.5" fill="#4ade80"/>
  <!-- Subject pin: International Trade (Singapore) — gold -->
  <circle cx="16" cy="30" r="3.5" fill="#d4a843" opacity="0.18"/>
  <circle cx="16" cy="30" r="2.8" fill="#d4a843"/>
  <!-- Subject pin: Marketing (Tokyo) — blue -->
  <circle cx="36" cy="30" r="3" fill="#60a5fa" opacity="0.18"/>
  <circle cx="36" cy="30" r="2.5" fill="#60a5fa"/>
  <!-- Arc: Finance → Trade -->
  <path d="M32 17 Q29 22 16 30" stroke="#4ade80" stroke-width="1" opacity="0.6" stroke-dasharray="2.5 2" fill="none"/>
  <!-- Arc: Finance → Marketing -->
  <path d="M32 17 Q34 22 36 30" stroke="#3D7EFF" stroke-width="1" opacity="0.6" stroke-dasharray="2.5 2" fill="none"/>
  <!-- Arc: Trade → Marketing -->
  <path d="M16 30 Q26 33 36 30" stroke="#d4a843" stroke-width="0.9" opacity="0.5" stroke-dasharray="2.5 2" fill="none"/>
</svg>
